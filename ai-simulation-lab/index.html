<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Simulation Lab</title><style>body{font:16px system-ui;background:#101827;color:#e2e8f0;max-width:960px;margin:40px auto;padding:20px}section{background:#1e293b;padding:24px;border-radius:16px;margin:20px 0}button{background:#38bdf8;color:#082f49;border:0;border-radius:8px;padding:12px;cursor:pointer;font-weight:bold}textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{padding:8px;border-bottom:1px solid #475569}</style><h1>AI Simulation Lab</h1><p>Alessio Cogoni · Laboratorio di resilienza AI</p><p>Versione GitHub Pages: simulazioni locali, senza token o chiamate API.</p><section><h2>Scenari deterministici</h2><button id="run">Esegui simulazioni</button><p id="summary" aria-live="polite"></p><ul id="results"></ul><button id="export">Esporta report JSON</button></section><section><h2>Hugging Face Playground — demo offline</h2><textarea id="prompt" maxlength="4000" placeholder="Inserisci un prompt"></textarea><button id="send">Invia</button><pre id="output" aria-live="polite"></pre></section><script>
const scenarios={success:200,empty:400,invalid:422,auth:401,forbidden:403,missing:404,timeout:408,rate_limit:429,server:500,unavailable:503,offline:0,malformed:502};
const $=id=>document.getElementById(id);
function simulate(name){const status=scenarios[name]??400;return {scenario:name,status,outcome:status===200?'success':[0,408,429,500,502,503].includes(status)?'fallback':'rejected',handled:true}}
let results=[];
$('run').onclick=()=>{results=Object.keys(scenarios).map(simulate);$('results').replaceChildren();for(const s of results){const li=document.createElement('li');li.textContent=s.scenario+' — '+s.status+' — '+s.outcome;$('results').append(li)}$('summary').textContent=results.length+' scenari elaborati in modalità simulata.'};
$('send').onclick=()=>{const prompt=$('prompt').value; $('output').textContent=JSON.stringify(prompt.trim()&&prompt.length<=4000?{...simulate('offline'),text:'Demo locale: nessuna inferenza AI reale.'}:simulate('invalid'),null,2)};
$('export').onclick=()=>{if(!results.length){$('summary').textContent='Esegui prima le simulazioni.';return}const url=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='simulation-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>

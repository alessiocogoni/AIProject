<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Simulation Lab</title><style>body{font:16px system-ui;background:#101827;color:#e2e8f0;max-width:960px;margin:40px auto;padding:20px}section{background:#1e293b;padding:24px;border-radius:16px;margin:20px 0}button{background:#38bdf8;color:#082f49;border:0;border-radius:8px;padding:12px;cursor:pointer;font-weight:bold}textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{padding:8px;border-bottom:1px solid #475569}</style><h1>AI Simulation Lab</h1><p>Alessio Cogoni · Laboratorio di resilienza AI</p><section><h2>Scenari deterministici</h2><button id="run">Esegui simulazioni</button><ul id="results"></ul></section><section><h2>Hugging Face Playground</h2><textarea id="prompt" maxlength="4000" placeholder="Inserisci un prompt"></textarea><button id="send">Invia</button><pre id="output" aria-live="polite"></pre></section><script>const $=id=>document.getElementById(id);async function request(url,options){const r=await fetch(url,options);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}$('run').onclick=async()=>{const list=$('results');list.textContent='';try{for(const s of await request('/api/scenarios')){const li=document.createElement('li');li.textContent=s.scenario+' — '+s.status+' — '+s.outcome;list.append(li)}}catch(e){list.textContent='Servizio non disponibile'}};$('send').onclick=async()=>{const b=$('send');b.disabled=true;$('output').textContent='Elaborazione…';try{$('output').textContent=JSON.stringify(await request('/api/infer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt').value})}),null,2)}catch(e){$('output').textContent='Richiesta non riuscita. Riprova.'}finally{b.disabled=false}};</script></html>

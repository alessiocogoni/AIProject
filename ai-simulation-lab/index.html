<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlessioAI</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#202124;font:16px/1.6 system-ui,sans-serif}main{width:min(720px,calc(100% - 32px));margin:auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}h1{text-align:center;font-size:clamp(38px,7vw,58px);letter-spacing:-3px;font-weight:650;margin:0 0 28px}.composer{display:flex;align-items:flex-end;gap:12px;border:1px solid #dedede;background:white;border-radius:24px;padding:16px;box-shadow:0 8px 32px #00000008}textarea{flex:1;min-width:0;min-height:58px;max-height:180px;resize:vertical;border:0;outline:none;background:transparent;color:inherit;font:inherit}button{flex:none;border:0;border-radius:50%;width:42px;height:42px;background:#222;color:white;cursor:pointer;font-size:24px}button:focus-visible,textarea:focus-visible{outline:2px solid #777;outline-offset:3px}#answer{white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 8px;color:#444}#answer:empty{display:none}@media(prefers-color-scheme:dark){body{background:#171717;color:#eee}.composer{background:#252525;border-color:#444}button{background:#eee;color:#222}#answer{color:#ccc}}
</style></head><body><main><h1>AlessioAI</h1><form id="composer" class="composer"><textarea id="prompt" aria-label="Scrivi un prompt" placeholder="Scrivi un messaggio…" maxlength="4000" required></textarea><button type="submit" aria-label="Invia messaggio">↑</button></form><div id="answer" role="status" aria-live="polite"></div></main><script>
const form=document.getElementById('composer'),prompt=document.getElementById('prompt'),answer=document.getElementById('answer');
form.addEventListener('submit',event=>{event.preventDefault();const value=prompt.value.trim();if(!value){answer.textContent='Scrivi un messaggio per continuare.';return}answer.textContent='Il servizio di intelligenza artificiale non è ancora collegato. Non posso generare una risposta al momento.';});
prompt.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit()}});
</script></body></html>

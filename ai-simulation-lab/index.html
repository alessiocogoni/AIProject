<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlessioAI</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#202124;font:16px/1.6 system-ui,sans-serif}main{width:min(720px,calc(100% - 32px));margin:auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}h1{text-align:center;font-size:clamp(38px,7vw,58px);letter-spacing:-3px;font-weight:650;margin:0 0 28px}
#chat{display:flex;flex-direction:column;gap:12px;margin:0 0 20px}#chat:empty{display:none}.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 16px;border-radius:18px;max-width:85%}.user{align-self:flex-end;background:#e9e9e9}.bot{align-self:flex-start;background:white;border:1px solid #e3e3e3}.bot:empty::after{content:'…';color:#999}
.composer{display:flex;align-items:flex-end;gap:12px;border:1px solid #dedede;background:white;border-radius:24px;padding:16px;box-shadow:0 8px 32px #00000008}textarea{flex:1;min-width:0;min-height:58px;max-height:180px;resize:vertical;border:0;outline:none;background:transparent;color:inherit;font:inherit}button{flex:none;border:0;border-radius:50%;width:42px;height:42px;background:#222;color:white;cursor:pointer;font-size:24px}button:disabled{opacity:.45;cursor:wait}button:focus-visible,textarea:focus-visible{outline:2px solid #777;outline-offset:3px}
#status{margin:12px 8px 0;color:#777;font-size:14px;text-align:center}#status:empty{display:none}
@media(prefers-color-scheme:dark){body{background:#171717;color:#eee}.composer,.bot{background:#252525;border-color:#444}.user{background:#333}button{background:#eee;color:#222}#status{color:#999}}
</style></head><body><main><h1>AlessioAI</h1><div id="chat" aria-live="polite"></div><form id="composer" class="composer"><textarea id="prompt" aria-label="Scrivi un messaggio" placeholder="Scrivi un messaggio…" maxlength="4000" required></textarea><button type="submit" aria-label="Invia messaggio">↑</button></form><div id="status" role="status"></div><p style="text-align:center;font-size:12px;color:#999;margin:16px 0 0">versione 4</p></main><script>
const form=document.getElementById('composer'),input=document.getElementById('prompt'),chat=document.getElementById('chat'),status=document.getElementById('status'),button=form.querySelector('button');
const SYSTEM="Sei AlessioAI, un assistente che parla sempre e solo in italiano. Rispondi direttamente e con precisione a quello che l'utente chiede, in modo naturale come in una conversazione. Risposte brevi: 1-3 frasi. Non spiegare il significato delle parole che l'utente usa: rispondi alla sua domanda.";
const EXAMPLES=[{role:'user',content:'Ciao, come stai?'},{role:'assistant',content:'Ciao! Sto bene, grazie. E tu come stai?'},{role:'user',content:'Qual è la capitale della Francia?'},{role:'assistant',content:'La capitale della Francia è Parigi.'},{role:'user',content:'Mi consigli cosa mangiare stasera?'},{role:'assistant',content:'Che ne dici di una bella pasta al pomodoro? È veloce e piace a tutti.'}];
const history=[];
let loading=null,lib=null,busy=false;
async function hasWebGPU(){try{return !!(navigator.gpu&&await navigator.gpu.requestAdapter())}catch{return false}}
function load(){
 if(loading)return loading;
 loading=(async()=>{
  lib=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2');
  lib.env.allowLocalModels=false;
  const gpu=await hasWebGPU();
  if(!gpu)lib.env.backends.onnx.wasm.numThreads=1;
  status.textContent='Preparazione del modello…';
  const gen=await lib.pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{device:gpu?'webgpu':'wasm',dtype:gpu?'q4f16':'q8',progress_callback:p=>{if(p.status==='progress'&&String(p.file).endsWith('.onnx')&&Number.isFinite(p.progress))status.textContent='Download del modello (solo la prima volta)… '+Math.round(p.progress)+'%';}});
  status.textContent='';
  return gen;
 })();
 loading.catch(()=>{loading=null});
 return loading;
}
function bubble(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.append(d);d.scrollIntoView({block:'end',behavior:'smooth'});return d}
input.addEventListener('focus',()=>{load().catch(()=>{})},{once:true});
form.addEventListener('submit',async e=>{
 e.preventDefault();const value=input.value.trim();if(busy||!value)return;
 busy=true;button.disabled=true;input.value='';
 bubble('user',value);const out=bubble('bot','');
 try{
  const generator=await load();
  history.push({role:'user',content:value});
  const recent=history.slice(-6).map((m,i,a)=>i===a.length-1?{role:'user',content:m.content+'\n\n(Rispondi in italiano a questa domanda.)'}:m);
  const messages=[{role:'system',content:SYSTEM},...EXAMPLES,...recent];
  let text='';
  const streamer=new lib.TextStreamer(generator.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>{text+=t;out.textContent=text;out.scrollIntoView({block:'end'});}});
  const output=await generator(messages,{max_new_tokens:160,do_sample:false,repetition_penalty:1.15,streamer});
  const generated=output[0]?.generated_text;
  const result=text.trim()?text:(Array.isArray(generated)?generated.at(-1)?.content:generated);
  if(typeof result!=='string'||!result.trim())throw Error('Risposta vuota');
  out.textContent=result.trim();
  history.push({role:'assistant',content:result.trim()});
 }catch(error){console.error(error);if(history.at(-1)?.role==='user')history.pop();status.textContent='';out.textContent='Impossibile completare la richiesta. '+String(error.message||error).slice(0,240)+' — Riprova.';}
 finally{busy=false;button.disabled=false;input.focus();}
});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)form.requestSubmit()}});
</script></body></html>
